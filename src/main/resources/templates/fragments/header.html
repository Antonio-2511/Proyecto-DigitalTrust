<header th:fragment="header"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <nav class="navbar">

        <!-- IZQUIERDA -->
        <div class="nav-left">

            <a th:href="@{/}" class="logo">
                <img th:src="@{/images/digitalTrust_logo.png}" alt="DigitalTrust Logo">
            </a>

            <ul class="nav-links" id="navLinks">

                <!-- 🌍 PÚBLICO -->
                <li>
                    <a th:href="@{/}" th:text="#{navbar.home}">Inicio</a>
                </li>

                <li>
                    <a th:href="@{/planes}" th:text="#{navbar.planes}">Planes</a>
                </li>

                <!-- 🔐 ADMIN + MODERADOR -->
                <li sec:authorize="hasAnyRole('ADMIN','MODERATOR')">
                    <a th:href="@{/reportes}">Reportes</a>
                </li>

                <li sec:authorize="hasAnyRole('ADMIN','MODERATOR')">
                    <a th:href="@{/advertencias}">Advertencias</a>
                </li>

                <!-- 👤 SOLO USER -->
                <li sec:authorize="hasRole('USER')">
                    <a th:href="@{/contacto}" th:text="#{navbar.contacto}">Contacto</a>
                </li>

                <!-- 🔓 TODOS LOGUEADOS -->
                <li sec:authorize="isAuthenticated()">
                    <a th:href="@{/detector-mensajes-sospechosos}"
                       th:text="#{navbar.mensajes}">
                        Mensajes
                    </a>
                </li>

            </ul>
        </div>

        <!-- DERECHA -->
        <div class="nav-right">

            <div class="nav-icons-group">
                <a th:href="@{/carrito}" class="nav-icon" title="Carrito">🛒</a>
                <button id="btnOpenSearch" class="nav-icon" title="Buscar">🔍</button>
            </div>

            <!-- NO LOGUEADO -->
            <div sec:authorize="isAnonymous()">
                <a th:href="@{/login}" class="nav-icon">👤</a>
            </div>

            <!-- LOGUEADO -->
            <div sec:authorize="isAuthenticated()" class="user-section">

                <!-- 👤 USERNAME -->
                <span sec:authentication="name" class="user-name"></span>


                <!-- 🚪 LOGOUT -->
                <form th:action="@{/logout}" method="post" style="margin:0;">
                    <button type="submit" class="btn btn-exit">
                        Salir
                    </button>
                </form>

            </div>

            <!-- 🌐 IDIOMA -->
            <div class="lang-switch">
                <a th:href="@{/(lang='es')}">ES</a> |
                <a th:href="@{/(lang='en')}">EN</a>
            </div>

        </div>
    </nav>

    <!-- 🔍 BUSCADOR -->
    <div id="searchOverlay" class="search-overlay" role="dialog" aria-modal="true">
        <div class="search-container">

            <div class="search-header">
                <input type="text"
                       id="searchInput"
                       th:placeholder="#{detector.placeholder}"
                       autocomplete="off">

                <button id="btnCloseSearch" class="close-btn" aria-label="Cerrar">
                    &times;
                </button>
            </div>

            <ul id="searchResults" class="search-results"></ul>

        </div>
    </div>

    <!-- 🔎 SCRIPT BUSCADOR -->
    <script th:inline="javascript">

        const appRoutes = [
            { name: [[#{navbar.home}]], url: [[@{/}]], keywords: ["home", "inicio"] },
            { name: [[#{navbar.planes}]], url: [[@{/planes}]], keywords: ["planes", "precios"] },
            { name: [[#{navbar.reportes}]], url: [[@{/reportes}]], keywords: ["reportes"] },
            { name: [[#{navbar.advertencias}]], url: [[@{/advertencias}]], keywords: ["alertas"] },
            { name: [[#{navbar.mensajes}]], url: [[@{/detector-mensajes-sospechosos}]], keywords: ["detector"] },
            { name: [[#{navbar.contacto}]], url: [[@{/contacto}]], keywords: ["contacto"] }
        ];

        const btnOpen = document.getElementById('btnOpenSearch');
        const btnClose = document.getElementById('btnCloseSearch');
        const overlay = document.getElementById('searchOverlay');
        const input = document.getElementById('searchInput');
        const resultsList = document.getElementById('searchResults');

        btnOpen.addEventListener('click', () => {
            overlay.classList.add('active');
            input.focus();
        });

        btnClose.addEventListener('click', () => {
            overlay.classList.remove('active');
            input.value = '';
            resultsList.innerHTML = '';
        });

        input.addEventListener('input', () => {

            const query = input.value.toLowerCase();
            resultsList.innerHTML = '';

            if (query.length > 0) {

                const filtered = appRoutes.filter(route =>
                    route.name.toLowerCase().includes(query) ||
                    route.keywords.some(k => k.includes(query))
                );

                filtered.forEach(route => {
                    const li = document.createElement('li');
                    li.innerHTML = `<a href="${route.url}">${route.name}</a>`;
                    resultsList.appendChild(li);
                });
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === "Escape") btnClose.click();
        });

    </script>

</header>
