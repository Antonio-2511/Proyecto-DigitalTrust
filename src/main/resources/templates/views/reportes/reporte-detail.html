<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/head :: head('Detalle Reporte')"></head>

<body>

<header th:replace="fragments/header :: header"></header>

<main class="container">

    <div class="report-wrapper">

        <!-- CABECERA -->
        <div class="report-header">
            <div>
                <h1 th:text="${reporte.titulo}"></h1>
                <span class="report-id">ID: <span th:text="${reporte.id}"></span></span>
            </div>

            <span class="report-badge"> Reporte</span>
        </div>

        <!-- CONTENIDO -->
        <div class="report-card">

            <!-- DESCRIPCIÓN -->
            <div class="section">
                <h3> Descripción</h3>
                <p th:text="${reporte.descripcion}"></p>
            </div>

            <!-- INFO -->
            <div class="info-grid">

                <div class="info-box">
                    <span class="info-label"> Fecha</span>
                    <span class="info-value"
                          th:text="${#temporals.format(reporte.fechaReporte, 'dd/MM/yyyy HH:mm')}"></span>
                </div>

                <div class="info-box">
                    <span class="info-label"> Estado</span>
                    <span class="info-value neutral">Pendiente</span>
                </div>

            </div>

        </div>

        <!-- ACCIONES -->
        <div class="report-actions">

            <a th:href="@{/reportes}" class="btn-back">
                ⬅ Volver
            </a>

            <a th:href="@{/reportes/edit/{id}(id=${reporte.id})}" class="btn-edit">
                 Editar
            </a>

        </div>

    </div>

</main>

<footer th:replace="fragments/footer :: footer"></footer>

</body>
</html>
