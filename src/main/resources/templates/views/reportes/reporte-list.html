<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Reportes')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="container">

    <div class="rl-page-header">
        <div class="rl-title-block">
            <span class="rl-eyebrow" th:text="#{reports.panel}"></span>
            <h1 class="rl-title" th:text="#{navbar.reportes}"></h1>
            <p class="rl-subtitle" th:text="#{reports.subtitle}"></p>
        </div>
        <a th:href="@{/reportes/new}" class="rl-btn-new" th:text="#{reports.new}"></a>
    </div>

    <div class="rl-wrapper">

        <div class="rl-card">
            <table class="rl-table">
                <thead>
                <tr>
                    <th th:text="#{reports.col.title}"></th>
                    <th th:text="#{reports.col.date}"></th>
                    <th th:text="#{reports.col.status}"></th>
                    <th th:text="#{reports.col.actions}"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${page.content}">

                    <td class="rl-td-title">
                        <span class="rl-report-title" th:text="${r.titulo}"></span>
                    </td>

                    <td class="rl-td-date">
                        <span th:text="${#temporals.format(r.fechaReporte, 'dd/MM/yyyy HH:mm')}"></span>
                    </td>

                    <td class="rl-td-status">
                        <span th:if="${!r.validado}" class="rl-badge rl-badge--pending"
                              th:text="#{reports.status.pending}"></span>
                        <span th:if="${r.validado and r.esFraude}" class="rl-badge rl-badge--fraud"
                              th:text="#{reports.status.fraud}"></span>
                        <span th:if="${r.validado and !r.esFraude}" class="rl-badge rl-badge--safe"
                              th:text="#{reports.status.safe}"></span>
                    </td>

                    <td class="rl-td-actions">

                        <a th:href="@{/reportes/{id}(id=${r.id})}"
                           class="rl-action rl-action--view"
                           th:text="#{reports.action.view}"></a>

                        <a th:if="${!r.validado}"
                           th:href="@{/reportes/edit/{id}(id=${r.id})}"
                           sec:authorize="hasAnyRole('USER','ADMIN')"
                           class="rl-action rl-action--edit"
                           th:text="#{reports.action.edit}"></a>

                        <span sec:authorize="hasAnyRole('MODERATOR','ADMIN')"
                              th:if="${!r.validado}">
                            <form th:action="@{/reportes/admin/{id}/validar(id=${r.id})}"
                                  method="post" style="display:inline;">
                                <button type="submit" name="fraude" value="true"
                                        class="rl-action rl-action--fraud"
                                        th:text="#{reports.action.confirmFraud}"></button>
                            </form>
                            <form th:action="@{/reportes/admin/{id}/validar(id=${r.id})}"
                                  method="post" style="display:inline;">
                                <button type="submit" name="fraude" value="false"
                                        class="rl-action rl-action--safe"
                                        th:text="#{reports.action.notFraud}"></button>
                            </form>
                        </span>

                        <form sec:authorize="hasAnyRole('MODERATOR','ADMIN')"
                              th:action="@{/reportes/delete/{id}(id=${r.id})}"
                              method="post" style="display:inline;">
                            <button type="submit"
                                    class="rl-action rl-action--delete"
                                    th:attr="onclick='return confirm(\'' + #{reports.confirm.delete} + '\')'">
                                <span th:text="#{reports.action.delete}"></span>
                            </button>
                        </form>

                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination" th:if="${page.totalPages > 1}">
            <a th:href="@{/reportes(page=${page.number - 1})}"
               th:classappend="${page.first} ? 'disabled'"
               class="page-btn" th:text="#{reports.pagination.prev}"></a>
            <span th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}">
                <a th:href="@{/reportes(page=${i})}" th:text="${i + 1}"
                   th:classappend="${i == page.number} ? 'active'" class="page-btn"></a>
            </span>
            <a th:href="@{/reportes(page=${page.number + 1})}"
               th:classappend="${page.last} ? 'disabled'"
               class="page-btn" th:text="#{reports.pagination.next}"></a>
        </div>

    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
