<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/head :: head('Reporte')"></head>

<body>

<header th:replace="fragments/header :: header"></header>

<main class="container">

    <h1 class="page-title">
        <span th:text="${#strings.isEmpty(reporte.id) ? 'Nuevo Reporte' : 'Editar Reporte'}"></span>
    </h1>

    <div class="form-container">

        <form th:action="@{/reportes/update}" method="post" th:object="${reporte}">

            <input type="hidden" th:field="*{id}" />

            <!-- TÍTULO -->
            <div class="form-group">
                <label>Título</label>
                <input type="text" th:field="*{titulo}" placeholder="Ej: Página sospechosa" required />
            </div>

            <!-- DESCRIPCIÓN -->
            <div class="form-group">
                <label>Descripción</label>
                <textarea th:field="*{descripcion}" rows="4"
                          placeholder="Describe el problema..."></textarea>
            </div>

            <!-- BOTONES -->
            <div class="form-actions">
                <button type="submit" class="btn-primary">Guardar</button>
                <a th:href="@{/reportes}" class="btn-cancel">Cancelar</a>
            </div>

        </form>

    </div>

</main>

<footer th:replace="fragments/footer :: footer"></footer>

</body>
</html>
