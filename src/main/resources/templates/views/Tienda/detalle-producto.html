<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(#{detalles.pestana})}"></head>

<body style="background-color: #A7F3D0; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">

<div th:replace="~{fragments/header :: header}"></div>

<main style="display: flex; justify-content: center; align-items: center; min-height: 90vh; padding-top: 80px; padding-bottom: 40px;">
    <div style="background: white; border-radius: 30px; display: flex; max-width: 1100px; width: 90%; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.1); flex-wrap: wrap;">

        <!-- SECCIÓN IZQUIERDA: IMAGEN -->
        <div style="flex: 1.2; min-width: 350px; background-color: #f0fdf4; display: flex; align-items: center; justify-content: center; padding: 50px;">
            <img th:src="@{'/images/' + ${s.imagenUrl}}" style="width: 100%; max-width: 400px; height: auto;">
        </div>

        <!-- SECCIÓN DERECHA: DATOS -->
        <div style="flex: 1; min-width: 350px; padding: 60px; display: flex; flex-direction: column; justify-content: space-between;">
            <div>
                <!-- Traducimos la categoría dinámicamente usando el nombre de la categoría como clave -->
                <span th:text="#{ 'categoria.' + ${s.categoria} }"
                      style="background-color: #064E3B; color: white; padding: 6px 18px; border-radius: 50px; font-size: 0.85rem; font-weight: 600; text-transform: uppercase;">
                    </span>

                <h1 th:text="${s.nombre}" style="color: #083a4d; font-size: 2.8rem; margin: 25px 0 15px 0;"></h1>
                <p th:text="${s.descripcion}" style="color: #4b5563; line-height: 1.8; font-size: 1.15rem; margin-bottom: 40px;"></p>
            </div>

            <div style="border-top: 2px solid #f3f4f6; padding-top: 30px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px;">
                <div>
                    <p th:text="#{detalles.precio_unitario}" style="color: #9ca3af; margin: 0; font-size: 0.9rem;"></p>
                    <span th:text="${s.precio} + '€'" style="font-size: 2.6rem; font-weight: 800; color: #083a4d;"></span>
                </div>

                <div style="display: flex; flex-direction: column; gap: 15px; align-items: flex-end;">
                    <form th:action="@{/carrito/add/{id}(id=${s.id})}" method="post">
                        <button type="submit" th:text="#{carrito.añadir}"
                                style="background-color: #083a4d; color: white; border: none; padding: 18px 45px; border-radius: 18px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all 0.3s ease;">
                        </button>
                    </form>

                    <a th:href="@{/tienda}" th:text="#{detalles.volver}" style="color: #083a4d; text-decoration: none; font-weight: 600;"></a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
