<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Forgot Password')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12
                         a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
            </svg>
        </div>

        <h2 th:text="#{forgot.title}">Forgot your password?</h2>
        <p th:text="#{forgot.subtitle}">Enter your email and we'll send you a reset link.</p>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}"   class="alert alert-error"   th:text="${errorMessage}"></div>

        <form th:action="@{/forgot-password}" method="post">
            <div class="form-group">
                <label for="email" th:text="#{forgot.email}">Email address</label>
                <input type="email" id="email" name="email"
                       th:placeholder="#{forgot.email.placeholder}" required>
            </div>
            <button type="submit" class="btn-primary" th:text="#{forgot.submit}">Send reset link</button>
        </form>

        <a th:href="@{/login}" class="back-link">
            ← <span th:text="#{forgot.back}">Back to login</span>
        </a>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
