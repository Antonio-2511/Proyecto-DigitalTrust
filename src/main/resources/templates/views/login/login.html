<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Login')}"></head>

<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="auth-main">

    <div class="auth-card">

        <h1 class="auth-title" th:text="#{login.title}">Iniciar sesión</h1>

        <!-- ERRORES -->
        <div th:if="${param.error}" class="auth-alert auth-alert--error">
            <span th:text="#{login.error}">Usuario o contraseña incorrectos</span>
        </div>

        <div th:if="${param.logout}" class="auth-alert auth-alert--success">
            <span th:text="#{login.logout}">Sesión cerrada correctamente</span>
        </div>

        <form th:action="@{/login}" method="post">

            <div class="form-group">
                <label th:text="#{login.username}">Usuario</label>
                <input type="text" name="username"
                       placeholder="Tu nombre de usuario" required>
            </div>

            <div class="form-group">
                <label th:text="#{login.password}">Contraseña</label>
                <input type="password" name="password"
                       placeholder="Tu contraseña" required>
            </div>

            <button type="submit" class="auth-btn"
                    th:text="#{login.submit}">
                Entrar
            </button>

        </form>

        <div class="auth-links">
            <a th:href="@{/forgot-password}"
               th:text="#{login.forgot}">
                ¿Olvidaste tu contraseña?
            </a>
            <span>·</span>
            <a th:href="@{/registro}">Crear cuenta</a>
        </div>

    </div>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
