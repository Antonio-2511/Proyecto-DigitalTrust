<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Reset Password')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6
                         a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
        </div>

        <h2 th:text="#{reset.title}">Set new password</h2>
        <p th:text="#{reset.subtitle}">Your new password must be at least 8 characters.</p>

        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" name="token" th:value="${token}">

            <div class="form-group">
                <label for="password" th:text="#{reset.password}">New password</label>
                <input type="password" id="password" name="password"
                       th:placeholder="#{reset.password.placeholder}"
                       required oninput="checkStrength(this.value)">
                <button type="button" class="toggle-pw" onclick="toggleVisibility('password')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
                         viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943
                                 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                    </svg>
                </button>
                <div class="strength-bar"><div class="strength-bar-fill" id="strengthFill"></div></div>
                <div class="strength-label" id="strengthLabel"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword" th:text="#{reset.confirm}">Confirm password</label>
                <input type="password" id="confirmPassword" name="confirmPassword"
                       th:placeholder="#{reset.confirm.placeholder}" required>
                <button type="button" class="toggle-pw" onclick="toggleVisibility('confirmPassword')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
                         viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943
                                 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                    </svg>
                </button>
            </div>

            <button type="submit" class="btn-primary" th:text="#{reset.submit}">Change password</button>
        </form>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script>
    function toggleVisibility(id) {
        const input = document.getElementById(id);
        input.type = input.type === 'password' ? 'text' : 'password';
    }

    function checkStrength(value) {
        const fill  = document.getElementById('strengthFill');
        const label = document.getElementById('strengthLabel');
        const score = [value.length >= 8, /[A-Z]/.test(value),
                       /[0-9]/.test(value), /[^A-Za-z0-9]/.test(value)]
                      .filter(Boolean).length;
        const levels = [
            { w: '25%',  color: '#ef4444', text: 'Weak'   },
            { w: '50%',  color: '#f59e0b', text: 'Fair'   },
            { w: '75%',  color: '#3b82f6', text: 'Good'   },
            { w: '100%', color: '#10b981', text: 'Strong' },
        ];
        const lvl = levels[score - 1] || { w: '0%', color: '', text: '' };
        fill.style.width           = lvl.w;
        fill.style.backgroundColor = lvl.color;
        label.textContent          = lvl.text;
    }
</script>
</body>
</html>
