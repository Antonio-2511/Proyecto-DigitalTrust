<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="fragments/head :: head('Advertencias')"></head>

<body>

<header th:replace="fragments/header :: header"></header>

<main class="container">

    <h1 class="page-title">⚠️ Advertencias</h1>

    <!-- MENSAJE -->
    <div th:if="${param.validated}" class="alert success">
        Advertencia generada correctamente
    </div>

    <!-- PROTECCIÓN: SOLO USUARIOS -->
    <div sec:authorize="hasAnyRole('USER','ADMIN')">

        <table class="table">

            <thead>
            <tr>
                <th>Mensaje</th>
                <th>Fecha</th>
                <th>Criticidad</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="a : ${page.content}">

                <!-- DESCRIPCIÓN -->
                <td th:text="${a.descripcion}"></td>

                <!-- FECHA -->
                <td th:text="${#temporals.format(a.fechaEnvio, 'dd/MM/yyyy HH:mm')}"></td>

                <!-- NIVEL VISUAL -->
                <td>
                    <span class="badge"
                          th:classappend="
                            ${a.nivelCriticidad >= 4} ? 'badge-danger' :
                            (${a.nivelCriticidad == 3} ? 'badge-warning' : 'badge-success')">

                        <span th:text="${a.nivelCriticidad}"></span>
                    </span>
                </td>

                <!-- ACCIONES -->
                <td>

                    <!-- VER -->
                    <a th:href="@{/advertencias/{id}(id=${a.id})}"
                       class="btn btn-sm btn-view">
                        👁 Ver
                    </a>

                    <!-- ELIMINAR (SOLO ADMIN) -->
                    <form sec:authorize="hasRole('ADMIN')"
                          th:action="@{/advertencias/delete(id=${a.id})}"
                          method="post"
                          style="display:inline;">

                        <button type="submit"
                                class="btn btn-sm btn-danger"
                                onclick="return confirm('¿Eliminar advertencia?');">
                            🗑
                        </button>

                    </form>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

    <!-- MENSAJE SI NO TIENE PERMISOS -->
    <div sec:authorize="!hasAnyRole('USER','ADMIN')"
         class="alert danger">

        🚫 No tienes permisos para ver advertencias

    </div>

</main>

<footer th:replace="fragments/footer :: footer"></footer>

</body>
</html>
