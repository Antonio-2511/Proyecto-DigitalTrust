<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Advertencias')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="container">

    <div class="rl-page-header">
        <div class="rl-title-block">
            <span class="rl-eyebrow" th:text="#{warnings.panel}"></span>
            <h1 class="rl-title" th:text="#{navbar.advertencias}"></h1>
            <p class="rl-subtitle" th:text="#{warnings.subtitle}"></p>
        </div>
    </div>

    <div class="rl-wrapper">

        <!-- VISTA STAFF -->
        <div th:if="${esStaff}">
            <div class="rl-card">
                <table class="rl-table">
                    <thead>
                    <tr>
                        <th th:text="#{warnings.col.title}"></th>
                        <th th:text="#{warnings.col.desc}"></th>
                        <th th:text="#{warnings.col.date}"></th>
                        <th th:text="#{warnings.col.level}"></th>
                        <th th:text="#{warnings.col.actions}"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="a : ${page.content}">

                        <td class="rl-td-title">
                            <span class="rl-report-title" th:text="${a.titulo}"></span>
                        </td>
                        <td class="rl-td-desc">
                            <span th:text="${a.descripcion}"></span>
                        </td>
                        <td class="rl-td-date">
                            <span th:text="${#temporals.format(a.fechaEnvio, 'dd/MM/yyyy HH:mm')}"></span>
                        </td>
                        <td class="rl-td-status">
                            <span class="al-criticidad"
                                  th:classappend="${a.nivelCriticidad >= 4} ? 'al-criticidad--high' :
                                                 (${a.nivelCriticidad == 3} ? 'al-criticidad--mid' : 'al-criticidad--low')"
                                  th:text="${a.nivelCriticidad}">
                            </span>
                        </td>
                        <td class="rl-td-actions">
                            <a th:href="@{/advertencias/{id}(id=${a.id})}"
                               class="rl-action rl-action--view"
                               th:text="#{warnings.action.view}"></a>

                            <form sec:authorize="hasRole('ADMIN')"
                                  th:action="@{/advertencias/delete(id=${a.id})}"
                                  method="post" style="display:inline;">
                                <button type="submit"
                                        class="rl-action rl-action--delete"
                                        th:attr="onclick='return confirm(\'' + #{warnings.confirm.delete} + '\')'">
                                    <span th:text="#{warnings.action.delete}"></span>
                                </button>
                            </form>
                        </td>

                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination" th:if="${page.totalPages > 1}">
                <a th:href="@{/advertencias(page=${page.number - 1})}"
                   th:classappend="${page.first} ? 'disabled'"
                   class="page-btn" th:text="#{warnings.pagination.prev}"></a>
                <span th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}">
                    <a th:href="@{/advertencias(page=${i})}" th:text="${i + 1}"
                       th:classappend="${i == page.number} ? 'active'" class="page-btn"></a>
                </span>
                <a th:href="@{/advertencias(page=${page.number + 1})}"
                   th:classappend="${page.last} ? 'disabled'"
                   class="page-btn" th:text="#{warnings.pagination.next}"></a>
            </div>
        </div>

        <!-- VISTA USUARIO -->
        <div th:if="${!esStaff}">

            <div th:if="${advertencias == null or advertencias.isEmpty()}"
                 class="mis-advertencias__empty"
                 th:text="#{warnings.empty}">
            </div>

            <div th:if="${advertencias != null and !advertencias.isEmpty()}"
                 class="rl-card">

                <div th:each="adv : ${advertencias}"
                     class="al-user-item"
                     th:classappend="${adv.esEmergencia} ? 'al-user-item--emergency' : ''">

                    <div class="al-user-item__nivel"
                         th:classappend="${adv.nivelCriticidad >= 4} ? 'al-criticidad--high' :
                                        (${adv.nivelCriticidad == 3} ? 'al-criticidad--mid' : 'al-criticidad--low')"
                         th:text="${adv.nivelCriticidad}">
                    </div>

                    <div class="al-user-item__body">
                        <div class="al-user-item__header">
                            <strong th:text="${adv.titulo}"></strong>
                            <span th:if="${adv.esEmergencia}"
                                  class="rl-badge rl-badge--fraud"
                                  th:text="#{warnings.emergency}"></span>
                        </div>
                        <p th:text="${adv.descripcion}"></p>
                        <small th:text="${#temporals.format(adv.fechaEnvio, 'dd/MM/yyyy HH:mm')}"></small>
                    </div>

                    <a th:href="@{/advertencias/{id}(id=${adv.id})}"
                       class="rl-action rl-action--view"
                       th:text="#{warnings.action.view}"></a>

                </div>
            </div>

        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
