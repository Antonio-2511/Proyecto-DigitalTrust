<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Advertencia')"></head>
<body>
<header th:replace="fragments/header :: header"></header>

<main class="container">
    <div class="rf-top-wrapper">
        <nav class="rf-breadcrumb">
            <a th:href="@{/advertencias}" class="rf-breadcrumb__link" th:text="#{warning.form.breadcrumb}"></a>
            <span class="rf-breadcrumb__sep">/</span>
            <span class="rf-breadcrumb__current"
                  th:text="${advertencia.id == null} ? #{warning.form.new} : #{warning.form.edit}">
            </span>
        </nav>
        <div class="rf-page-header">
            <h1 class="rf-page-title"
                th:text="${advertencia.id == null} ? #{warning.form.new} : #{warning.form.edit}">
            </h1>
            <p class="rf-page-subtitle"
               th:text="${advertencia.id == null} ? #{warning.form.subtitle.new} : #{warning.form.subtitle.edit}">
            </p>
        </div>
    </div>

    <div class="rf-layout rf-layout--centered">
        <div class="rf-main-col">
            <div class="rf-card">
                <form th:action="${advertencia.id == null} ? @{/advertencias/insert} : @{/advertencias/update}"
                      th:object="${advertencia}" method="post">

                    <input type="hidden" th:field="*{id}" />

                    <div th:if="${#fields.hasErrors('*')}" class="alert danger">
                        <ul style="margin:0; padding-left:20px;">
                            <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                        </ul>
                    </div>

                    <div class="rf-field">
                        <label class="rf-label" for="titulo" th:text="#{warning.form.field.title}"></label>
                        <input class="rf-input" id="titulo" type="text" th:field="*{titulo}"
                               th:placeholder="#{warning.form.field.title.placeholder}" required />
                    </div>

                    <div class="rf-field">
                        <label class="rf-label" for="descripcion" th:text="#{warning.form.field.desc}"></label>
                        <textarea class="rf-input rf-textarea" id="descripcion" th:field="*{descripcion}"
                                  rows="5" th:placeholder="#{warning.form.field.desc.placeholder}"></textarea>
                    </div>

                    <div class="rf-field">
                        <label class="rf-label" for="nivelCriticidad" th:text="#{warning.form.field.level}"></label>
                        <select class="rf-input" id="nivelCriticidad" th:field="*{nivelCriticidad}">
                            <option value="1" th:text="#{warning.form.level.1}"></option>
                            <option value="2" th:text="#{warning.form.level.2}"></option>
                            <option value="3" th:text="#{warning.form.level.3}"></option>
                            <option value="4" th:text="#{warning.form.level.4}"></option>
                            <option value="5" th:text="#{warning.form.level.5}"></option>
                        </select>
                    </div>

                    <div class="rf-field">
                        <label class="rf-label" for="fuenteConfiableId" th:text="#{warning.form.field.source}"></label>
                        <select class="rf-input" id="fuenteConfiableId" th:field="*{fuenteConfiableId}">
                            <option value="" th:text="#{warning.form.source.placeholder}"></option>
                            <option th:each="f : ${fuentes}" th:value="${f.idFuente}" th:text="${f.nombreEntidad}"></option>
                        </select>
                    </div>

                    <input type="hidden" th:field="*{esEmergencia}" value="false" />

                    <div class="rf-actions">
                        <a th:href="@{/advertencias}" class="rf-btn rf-btn--cancel" th:text="#{common.cancel}"></a>
                        <button type="submit" class="rf-btn rf-btn--save"
                                th:text="${advertencia.id == null} ? #{warning.form.btn.create} : #{warning.form.btn.save}">
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="rf-side-col">
            <div class="rf-card rf-card--side">
                <p class="rf-side-title" th:text="#{warning.form.tips.title}"></p>
                <ul class="rf-tips">
                    <li class="rf-tip"><span class="rf-tip__icon">&#9679;</span><span th:text="#{warning.form.tip1}"></span></li>
                    <li class="rf-tip"><span class="rf-tip__icon">&#9679;</span><span th:text="#{warning.form.tip2}"></span></li>
                    <li class="rf-tip"><span class="rf-tip__icon">&#9679;</span><span th:text="#{warning.form.tip3}"></span></li>
                    <li class="rf-tip"><span class="rf-tip__icon">&#9679;</span><span th:text="#{warning.form.tip4}"></span></li>
                </ul>
            </div>
            <div class="rf-notice">
                <span class="rf-notice__icon">&#9888;</span>
                <p class="rf-notice__text" th:text="#{warning.form.notice}"></p>
            </div>
        </div>
    </div>
</main>

<footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
